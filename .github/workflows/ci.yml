# =============================================================================
# RSemble AI quality gate — Plan 006 workstream D.
#
# Runs the exact same gate a local checkout runs (format, lint, typechecks,
# tests, coverage thresholds, production build) on a clean install.
# Deterministic and credential-free by design: provider adapters are
# exercised through mocks/fixtures; no live provider, Codex login, bridge
# secret, or paid quota is required or accepted here.
#
# Coverage and build diagnostics: the text coverage table and any build
# errors are printed to the job logs (artifacts are gitignored outputs and
# are deliberately not uploaded).
# =============================================================================

name: ci

on:
  pull_request:
  push:
    branches: [master]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Format, lint, typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Prettier formatting check
        run: npm run format:check
      - name: ESLint
        run: npm run lint
      - name: Typecheck (web)
        run: npm run typecheck:web
      - name: Typecheck (server)
        run: npm run typecheck:server

  test:
    name: Tests + coverage
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Vitest with coverage thresholds
        run: npm run test:coverage

  build:
    name: Production build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build (tsc -b + vite build)
        run: npm run build
