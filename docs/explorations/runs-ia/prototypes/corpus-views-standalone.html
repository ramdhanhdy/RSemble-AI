/* RSemble AI — Prototype Design System

   Dark theme, cyan accent, Geist font stack. */

:root {
  /* Colors */
  --canvas: #0a0a0a;
  --shell: #0a0a0a;
  --panel: #121212;
  --card: #121212;
  --card-hover: #1a1a1a;
  --raised: #181818;
  --edge: #262626;
  --edge-bright: #3a3a3a;
  --accent: #00e5ff;
  --accent-deep: #00a9bd;
  --on-accent: #001719;
  --text: #ededed;
  --text-secondary: #a1a1a1;
  --text-muted: #777777;
  --success: #00ff9d;
  --warning: #ffb300;
  --error: #ff4d4d;

  /* Typography */
  --font-sans: "Geist", ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --font-mono: "Geist Mono", ui-monospace, SFMono-Regular, monospace;

  /* Spacing */
  --space-1: 4px;
  --space-2: 8px;
  --space-3: 12px;
  --space-4: 16px;
  --space-5: 20px;
  --space-6: 24px;
  --space-8: 32px;

  /* Radius */
  --radius-sm: 4px;
  --radius-md: 6px;
  --radius-lg: 8px;

  /* Shadows */
  --shadow-glow: 0 0 0 1px rgba(0,229,255,.45), 0 0 24px rgba(0,229,255,.18);
  --shadow-cta: 0 4px 20px rgba(0,229,255,.25);
  --shadow-popover: 0 16px 48px -12px rgba(0,0,0,.7);
}

* { margin: 0; padding: 0; box-sizing: border-box; }

html, body {
  height: 100%;
  background-color: var(--canvas);
  color: var(--text);
  font-family: var(--font-sans);
  font-size: 14px;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
}

:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 2px;
  border-radius: var(--radius-sm);
}

::-webkit-scrollbar { width: 8px; height: 8px; }
::-webkit-scrollbar-thumb { background-color: var(--edge-bright); border-radius: 9999px; }
::-webkit-scrollbar-thumb:hover { background-color: #4a4a4a; }
::-webkit-scrollbar-track { background-color: transparent; }

/* ===== Layout ===== */

.app-shell {
  display: flex;
  flex-direction: column;
  height: 100vh;
  overflow: hidden;
}

.app-header {
  display: grid;
  grid-template-columns: minmax(0,1fr) auto minmax(0,1fr);
  align-items: center;
  gap: var(--space-2);
  height: 56px;
  border-bottom: 1px solid var(--edge);
  background: var(--shell);
  padding: 0 var(--space-4);
  flex-shrink: 0;
}

.header-left { display: flex; align-items: center; gap: 10px; }
.header-center { justify-self: center; }
.header-right { display: flex; align-items: center; gap: var(--space-2); justify-self: end; }

.logo {
  display: flex;
  align-items: center;
  gap: var(--space-2);
  font-size: 16px;
  font-weight: 600;
  letter-spacing: -0.01em;
}
.logo-mark {
  width: 22px;
  height: 22px;
  color: var(--accent);
}

/* ===== Navigation ===== */

.nav-primary {
  display: flex;
  align-items: center;
  gap: 2px;
}

.nav-item {
  display: flex;
  align-items: center;
  gap: 6px;
  min-height: 44px;
  padding: 0 var(--space-3);
  border-radius: var(--radius-md);
  font-size: 14px;
  font-weight: 500;
  color: var(--text-secondary);
  text-decoration: none;
  cursor: pointer;
  transition: color 150ms, background-color 150ms;
  background: none;
  border: none;
  font-family: inherit;
}
.nav-item:hover { background: var(--panel); color: var(--text); }
.nav-item.active { color: var(--accent); }

.nav-item svg { width: 15px; height: 15px; }

/* Connection pill */
.conn-pill {
  display: flex;
  align-items: center;
  gap: var(--space-2);
  border: 1px solid var(--edge);
  background: var(--panel);
  border-radius: 9999px;
  padding: 0 var(--space-3);
  height: 36px;
  font-family: var(--font-mono);
  font-size: 12px;
  cursor: pointer;
}
.conn-dot { width: 8px; height: 8px; border-radius: 50%; }
.conn-dot.connected { background: var(--success); }
.conn-dot.disconnected { background: var(--error); }

/* ===== Workspace ===== */

.workspace {
  flex: 1;
  overflow: hidden;
  display: flex;
}

.workspace-split {
  display: grid;
  grid-template-columns: 380px 1fr;
  height: 100%;
  overflow: hidden;
}

.list-pane {
  border-right: 1px solid var(--edge);
  background: var(--shell);
  overflow: hidden;
  display: flex;
  flex-direction: column;
}

.detail-pane {
  overflow: auto;
  background: var(--canvas);
}

.workspace-full {
  flex: 1;
  overflow: auto;
  padding: var(--space-6);
}

/* ===== Compare ===== */

.compare-toolbar {
  display: flex;
  align-items: center;
  gap: var(--space-3);
  padding: var(--space-2) var(--space-4);
  border-bottom: 1px solid var(--edge);
  background: var(--panel);
}

.mode-toggle {
  display: inline-flex;
  border-radius: var(--radius-md);
  border: 1px solid var(--edge);
  overflow: hidden;
}
.mode-toggle button {
  padding: 6px var(--space-4);
  font-size: 13px;
  font-weight: 500;
  border: none;
  background: transparent;
  color: var(--text-secondary);
  cursor: pointer;
  font-family: inherit;
  transition: background 150ms, color 150ms;
}
.mode-toggle button.active {
  background: var(--accent);
  color: var(--on-accent);
}

/* ===== Cards / Surfaces ===== */

.card {
  background: var(--card);
  border: 1px solid var(--edge);
  border-radius: var(--radius-lg);
  padding: var(--space-4);
}
.card-hover:hover { background: var(--card-hover); }

/* ===== Run List ===== */

.run-list { list-style: none; overflow: auto; flex: 1; }

.run-row {
  display: flex;
  align-items: center;
  gap: var(--space-3);
  padding: var(--space-3) var(--space-4);
  border-bottom: 1px solid var(--edge);
  cursor: pointer;
  transition: background 100ms;
  text-decoration: none;
  color: inherit;
}
.run-row:hover { background: var(--card-hover); }
.run-row.selected { background: var(--raised); border-left: 2px solid var(--accent); }

.run-row-icon {
  width: 32px;
  height: 32px;
  border-radius: var(--radius-md);
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
  font-size: 11px;
  font-weight: 600;
  font-family: var(--font-mono);
}

.source-label {
  font-size: 10px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.05em;
  padding: 2px 6px;
  border-radius: var(--radius-sm);
  font-family: var(--font-mono);
}
.source-adhoc { background: rgba(0,229,255,0.1); color: var(--accent); }
.source-experiment { background: rgba(255,179,0,0.1); color: var(--warning); }
.source-legacy { background: rgba(119,119,119,0.15); color: var(--text-muted); }

/* ===== Status ===== */

.status-mark {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  font-size: 11px;
  font-weight: 500;
  font-family: var(--font-mono);
}
.status-dot { width: 6px; height: 6px; border-radius: 50%; }
.status-completed .status-dot { background: var(--success); }
.status-failed .status-dot { background: var(--error); }
.status-partial .status-dot { background: var(--warning); }
.status-running .status-dot { background: var(--accent); animation: pulse 1.5s infinite; }
.status-interrupted .status-dot { background: var(--text-muted); }
.status-aborted .status-dot { background: var(--text-muted); }

@keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }

/* ===== Filters ===== */

.filters-bar {
  display: flex;
  align-items: center;
  gap: var(--space-2);
  padding: var(--space-3) var(--space-4);
  border-bottom: 1px solid var(--edge);
  flex-wrap: wrap;
}

.filter-select, .filter-input {
  background: var(--panel);
  border: 1px solid var(--edge);
  border-radius: var(--radius-md);
  color: var(--text);
  font-size: 13px;
  font-family: inherit;
  padding: 6px var(--space-3);
  cursor: pointer;
}
.filter-select:focus, .filter-input:focus {
  border-color: var(--accent);
  outline: none;
}
.filter-input {
  flex: 1;
  min-width: 150px;
  cursor: text;
}

/* ===== Buttons ===== */

.btn {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 6px var(--space-4);
  border-radius: var(--radius-md);
  font-size: 13px;
  font-weight: 500;
  font-family: inherit;
  cursor: pointer;
  border: 1px solid var(--edge);
  background: var(--panel);
  color: var(--text);
  text-decoration: none;
  transition: background 150ms, border-color 150ms;
}
.btn:hover { background: var(--card-hover); border-color: var(--edge-bright); }

.btn-primary {
  background: var(--accent);
  color: var(--on-accent);
  border-color: var(--accent);
}
.btn-primary:hover { background: var(--accent-deep); border-color: var(--accent-deep); }

.btn-ghost {
  background: transparent;
  border-color: transparent;
  color: var(--text-secondary);
}
.btn-ghost:hover { background: var(--panel); color: var(--text); }

.btn-sm { padding: 4px var(--space-3); font-size: 12px; }

/* ===== Run Detail ===== */

.detail-header {
  padding: var(--space-6);
  border-bottom: 1px solid var(--edge);
}
.detail-title { font-size: 18px; font-weight: 600; margin-bottom: var(--space-2); }
.detail-meta {
  display: flex;
  align-items: center;
  gap: var(--space-4);
  font-size: 12px;
  color: var(--text-secondary);
  font-family: var(--font-mono);
}

.detail-section {
  padding: var(--space-6);
  border-bottom: 1px solid var(--edge);
}
.detail-section-title {
  font-size: 12px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.05em;
  color: var(--text-muted);
  margin-bottom: var(--space-4);
}

/* ===== Candidate cards ===== */

.candidate-card {
  background: var(--card);
  border: 1px solid var(--edge);
  border-radius: var(--radius-lg);
  padding: var(--space-6);
  cursor: pointer;
  text-decoration: none;
  color: inherit;
  transition: border-color 200ms, background 200ms;
  display: block;
}
.candidate-card:hover {
  border-color: var(--accent);
  background: var(--card-hover);
}
.candidate-card-title { font-size: 18px; font-weight: 600; margin-bottom: var(--space-2); }
.candidate-card-desc { color: var(--text-secondary); font-size: 14px; line-height: 1.6; }

/* ===== Group headers ===== */

.group-header {
  display: flex;
  align-items: center;
  gap: var(--space-2);
  padding: var(--space-3) var(--space-4);
  font-size: 11px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.05em;
  color: var(--text-muted);
  background: var(--shell);
  border-bottom: 1px solid var(--edge);
  position: sticky;
  top: 0;
  z-index: 1;
}
.group-count {

  font-size: 10px;
  color: var(--text-muted);
  background: var(--raised);
  padding: 1px 6px;
  border-radius: 9999px;
}

/* ===== Badge ===== */

.nav-badge {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  min-width: 16px;
  height: 16px;
  border-radius: 9999px;
  background: var(--error);
  color: var(--canvas);
  font-size: 10px;
  font-weight: 700;
  padding: 0 4px;
  margin-left: 4px;
}

.eval-matrix {

}
.eval-matrix th, .eval-matrix td {

  letter-spacing: 0.05em;
}
.eval-matrix td a { color: var(--accent); text-decoration: none; }
.eval-matrix td a:hover { text-decoration: underline; }

.matrix-score {
  font-family: var(--font-mono);
  font-weight: 600;
}
.matrix-score.high { color: var(--success); }
.matrix-score.mid { color: var(--warning); }
.matrix-score.low { color: var(--error); }
.matrix-cell-na { color: var(--text-muted); font-style: italic; }

.mono { font-family: var(--font-mono); }
.muted { color: var(--text-muted); }
.secondary { color: var(--text-secondary); }
.accent { color: var(--accent); }
.success { color: var(--success); }
.warning { color: var(--warning); }
.error { color: var(--error); }

.divider { height: 1px; background: var(--edge); margin: var(--space-4) 0; }

}
.provenance-link { color: var(--accent); text-decoration: none; cursor: pointer; }

// Timestamp hygiene (CC-2): completedAt must follow createdAt. Where the dataset

function durationToMs(d) {
  if (!d) return 0;
  const h = /(\d+)h/.exec(d);
  const m = /(\d+)m/.exec(d);
  const s = /(\d+)s/.exec(d);
  return ((h ? parseInt(h[1], 10) : 0) * 3600 + (m ? parseInt(m[1], 10) : 0) * 60 + (s ? parseInt(s[1], 10) : 0)) * 1000;
}
RUNS.forEach(r => {
  if (r.completedAt && r.createdAt && r.duration) {
    const created = new Date(r.createdAt).getTime();
    if (new Date(r.completedAt).getTime() <= created) {
      r.completedAt = new Date(created + durationToMs(r.duration)).toISOString();
    }
  }
});

function getSourceLabel(source) {

  return labels[source] || source;
}

function formatDate(iso) {
  if (!iso) return "—";
  const d = new Date(iso);
  return d.toLocaleDateString("en-US", { month: "short", day: "numeric" }) + " " + d.toLocaleTimeString("en-US", { hour: "2-digit", minute: "2-digit" });
}

function timeAgo(iso) {
  if (!iso) return "—";
  const now = new Date("2026-08-09T09:00:00Z");
  const then = new Date(iso);
  const diffH = Math.floor((now - then) / 3600000);
  if (diffH < 1) return "just now";
  if (diffH < 24) return diffH + "h ago";
  const diffD = Math.floor(diffH / 24);
  if (diffD === 1) return "yesterday";
  if (diffD < 7) return diffD + "d ago";
  return Math.floor(diffD / 7) + "w ago";
}

function isSuperseded(run) { return RUNS.some(x => x.reusedFrom && x.reusedFrom.sourceRunId === run.id); }

}

      const exp = EXPERIMENTS.find(e => e.id === expId);
      html += `<div class="group-header">${exp ? exp.suiteName : expId} <span class="group-count">${expRuns.length} runs</span></div>`;
      html += `<div class="exp-group-sub">${expId}${exp ? " · " + exp.status + " · " + exp.models.length + " models" : ""}</div>`;
      html += expRuns.map(runRowHtml).join("");
    });
  } else {
    html += runs.map(runRowHtml).join("");
  }

  if (!html) {
    html = `<div class="empty-state"><div class="empty-state-title">No runs in this view</div><p>Try another segment or clear the filters.</p></div>`;
  }
  list.innerHTML = html;
}

function runRowHtml(r) {
  const attn = isAttention(r.status);
  const trialBadge = r.trial ? `<span class="tag">trial ${r.trial}</span>` : "";
  const retryBadge = r.reusedFrom ? `<span class="tag">↺ retry</span>` : "";
  const costText = r.cost ? " · $" + r.cost.totalUsd.toFixed(4) : "";
  return `
    <div class="run-row ${selectedRunId === r.id ? "selected" : ""} ${attn ? "needs-attention" : ""} ${r.source === "experiment" ? "run-row-child" : ""}" onclick="selectRun('${r.id}')">
      <div class="run-row-icon source-${r.source}">${r.source === "adhoc" ? "AH" : r.source === "experiment" ? "EX" : "LG"}</div>
      <div style="flex:1;min-width:0">
        <div style="display:flex;align-items:center;gap:6px;margin-bottom:2px;flex-wrap:wrap">
          <span class="source-label source-${r.source}">${getSourceLabel(r.source)}</span>
          ${r.source === "experiment" ? `<span class="muted" style="font-size:11px;font-family:var(--font-mono)">${r.taskName || r.taskId}</span>` : ""}
          <span class="status-mark status-${r.status}"><span class="status-dot"></span>${getStatusLabel(r.status)}</span>
          ${attn ? '<span class="attention-chip">Needs attention</span>' : ""}
          ${trialBadge}${retryBadge}
        </div>
        <div style="font-size:13px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${r.taskTitle}</div>
        <div style="font-size:11px;color:var(--text-muted);font-family:var(--font-mono);margin-top:2px">
          ${timeAgo(r.createdAt)} · ${(r.candidates || []).length} models · ${r.mode}${costText}
        </div>
      </div>
    </div>`;
}

function selectRun(id) {
  selectedRunId = id;
  renderRunList();
  renderRunDetail(id);
  updateHash();
}

// ===== Run Detail (baseline parity) =====
function renderRunDetail(id) {
  const r = getRunById(id);
  if (!r) return;
  const pane = document.getElementById("detailPane");
  if (!pane) return;
  const provenanceHtml = r.source === "experiment" ? `
    <div class="provenance-trail" style="margin-top:8px">
      ← <a class="provenance-link" onclick="navigate('evaluations')">Experiment: ${r.suiteName || r.experimentId}</a>
      · Task: ${r.taskName || r.taskId}
      ${r.trial > 1 ? " · Trial " + r.trial : ""}
    </div>
  ` : "";
  const reusedFromHtml = r.reusedFrom ? `
    <div class="provenance-trail" style="margin-top:4px">
      ↺ Retry of <a class="provenance-link" onclick="selectRun('${r.reusedFrom.sourceRunId}')">${r.reusedFrom.sourceRunId}</a>
    </div>
  ` : "";
  const legacyNote = r.source === "legacy" ? `
    <div class="card" style="margin-bottom:16px;border-color:var(--warning);background:rgba(255,179,0,0.05)">
      <strong style="color:var(--warning)">Summary only</strong> — this is a legacy imported record with no detailed evidence.
    </div>
  ` : "";

  pane.innerHTML = `
    <div class="detail-header">
      <div style="display:flex;align-items:center;gap:12px;margin-bottom:8px">
        <span class="source-label source-${r.source}">${getSourceLabel(r.source)}</span>
        <span class="status-mark status-${r.status}"><span class="status-dot"></span>${getStatusLabel(r.status)}</span>
        <span class="tag">${r.mode}</span>
      </div>
      <div class="detail-title">${r.taskTitle}</div>
      <div class="detail-meta">
        <span>${formatDate(r.createdAt)}</span>
        <span>· ${r.duration || "—"}</span>
        <span>· ${(r.candidates || []).length} candidates</span>
        ${r.cost ? '<span>· $' + r.cost.totalUsd.toFixed(4) + '</span>' : ""}
      </div>
      ${provenanceHtml}
      ${reusedFromHtml}
      <div style="display:flex;gap:8px;margin-top:16px;flex-wrap:wrap">
        ${r.source === "legacy"
          ? '<button class="btn btn-sm" disabled title="Legacy run has no config to load">Open in Compare</button>'
          : `<button class="btn btn-sm" onclick="openInCompare('${r.id}')">Open in Compare</button>`}
        <button class="btn btn-sm" onclick="copyLink('${r.id}', this)">Copy link — this device</button>
      </div>
    </div>
    ${legacyNote}
    ${r.source !== "legacy" ? renderDetailSections(r) : ""}
  `;
}

function renderDetailSections(r) {
  const candidatesHtml = (r.candidates || []).map((c, i) => `
    <div class="card" style="margin-bottom:12px">
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:8px">
        <div style="display:flex;align-items:center;gap:8px">
          <span class="run-row-icon" style="background:var(--raised);color:var(--text-secondary)">${i+1}</span>
          <strong>${c.model}</strong>
          ${c.rank ? '<span class="tag">Rank #' + c.rank + '</span>' : ""}
        </div>
        <span class="status-mark status-${c.status === "done" ? "completed" : c.status === "error" ? "failed" : c.status === "pending" ? "interrupted" : "running"}">
          <span class="status-dot"></span>${c.status}
          ${c.score ? " · " + c.score : ""}
        </span>
      </div>
      ${c.error ? '<div style="color:var(--error);font-size:12px;font-family:var(--font-mono)">Error: ' + c.error + "</div>" : ""}
      <div style="font-size:12px;color:var(--text-muted);font-family:var(--font-mono)">${c.providerId}/${c.slug}</div>
    </div>
  `).join("");

  const judgeHtml = r.judge ? `
    <div class="card">
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:8px">
        <strong>${r.judge.model}</strong>
        ${r.judge.error
          ? '<span class="error" style="font-size:12px">' + r.judge.error + "</span>"
          : r.fusionStatus === "no_accept"
            ? '<span class="status-mark status-partial"><span class="status-dot"></span>No consensus — fusion not accepted</span>'
            : '<span class="status-mark status-completed"><span class="status-dot"></span>Accepted</span>'}
      </div>
      <div style="font-size:12px;color:var(--text-muted);font-family:var(--font-mono)">${r.judge.providerId} · ${r.judge.instruction}</div>
      ${r.judge.consensus ? '<div style="margin-top:8px;font-size:12px;color:var(--text-secondary)">' + Object.entries(r.judge.consensus).map(([k,v]) => k + ": " + (v*100).toFixed(0) + "%").join(" · ") + "</div>" : ""}
    </div>
  ` : "";

  return `
    <div class="detail-section">
      <div class="detail-section-title">Task</div>
      <div style="font-size:14px;margin-bottom:8px">${r.taskPrompt || "—"}</div>
      ${r.systemPrompt ? '<div style="font-size:12px;color:var(--text-muted)">System: ' + r.systemPrompt + "</div>" : ""}
      <div style="font-size:12px;color:var(--text-muted);font-family:var(--font-mono);margin-top:4px">Temperature: ${r.temperature}</div>
    </div>
    <div class="detail-section">
      <div class="detail-section-title">Candidates (${(r.candidates || []).length})</div>
      ${candidatesHtml}
    </div>
    ${r.judge ? '<div class="detail-section"><div class="detail-section-title">Judge Evidence</div>' + judgeHtml + "</div>" : ""}
    ${r.rankResult ? '<div class="detail-section"><div class="detail-section-title">Result</div><div class="card" style="border-color:var(--accent)"><strong style="color:var(--accent)">Rank Winner: ' + (r.candidates.find(c => c.id === r.rankResult)?.model || "?") + "</strong></div></div>" : ""}
    ${r.fusionResult ? '<div class="detail-section"><div class="detail-section-title">Fusion Result</div><div class="card"><div style="font-size:14px;line-height:1.6">' + r.fusionResult + "</div></div></div>" : ""}
  `;
}

// ===== Compare View =====
function renderCompareView() {
  const ws = document.getElementById("workspace");

  // Simulated completed run — only reachable via explicit "Run comparison".
  if (compareState.completed) {
    const run = getRunById(compareState.runId);
    const winnerModel = run
      ? (run.rankResult
          ? (run.candidates.find(c => c.id === run.rankResult)?.model || run.candidates[0]?.model)
          : run.candidates[0]?.model)
      : "DeepSeek V4 Flash";
    const resultLabel = run && run.mode === "fuse" ? "Fused" : "Rank Winner";
    const modelsLine = run ? run.candidates.map(c => c.model).join(", ") : "DeepSeek V4 Flash, GLM-5.2, Qwen 3.6 35B";
    const bodyText = run
      ? esc((run.taskPromptFull || run.taskPrompt || "")).slice(0, 240) + "…"
      : "The multi-head self-attention mechanism projects the input into Query, Key, and Value matrices, computes scaled dot-product attention, and concatenates multiple heads to capture different representation subspaces…";
    ws.innerHTML = `
      <div class="workspace-full">
        <div class="compare-toolbar" style="margin:-24px -24px 24px;border-radius:0">
          <div class="mode-toggle"><button class="${run && run.mode === "fuse" ? "" : "active"}">Rank</button><button class="${run && run.mode === "fuse" ? "active" : ""}">Fuse</button></div>
          <span class="muted" style="font-size:12px">${run ? run.candidates.length : 3} candidates · ${modelsLine}</span>
        </div>
        <div class="card" style="border-color:var(--success);margin-bottom:16px">
          <div style="display:flex;align-items:center;gap:12px;margin-bottom:12px;flex-wrap:wrap">
            <span class="status-mark status-completed"><span class="status-dot"></span>Completed</span>
            <strong>${resultLabel}: ${winnerModel}</strong>
          </div>
          <div style="font-size:12px;color:var(--text-muted);font-family:var(--font-mono);margin-bottom:8px">${run ? "Simulated from run " + run.id : ""}</div>
          <div style="font-size:14px;line-height:1.6;color:var(--text-secondary)">${bodyText}</div>
        </div>
        <div style="display:flex;gap:8px">
          <button class="btn btn-primary" onclick="viewRecord('${run?.id}')">View record →</button>
          <button class="btn" onclick="resetCompare()">New Compare</button>
        </div>
      </div>
    `;
    return;
  }

  // Configuration loaded from a run record (Open in Compare) — ready to run, no fabricated result.
  if (compareState.preloaded && compareState.runId) {
    const run = getRunById(compareState.runId);
    if (!run) {
      compareState = { completed: false, runId: null, preloaded: false };
    } else {
      const candidates = run.candidates || [];
      ws.innerHTML = `
        <div class="workspace-full">
          <div class="compare-toolbar" style="margin:-24px -24px 24px;border-radius:0">
            <div class="mode-toggle"><button class="${run.mode === "fuse" ? "" : "active"}">Rank</button><button class="${run.mode === "fuse" ? "active" : ""}">Fuse</button></div>
            <span class="muted" style="font-size:12px">${candidates.length} model slots · ${run.id}</span>
          </div>
          <div class="card" style="border-color:var(--accent);margin-bottom:16px">
            <div style="display:flex;align-items:center;gap:12px;margin-bottom:12px;flex-wrap:wrap">
              <span class="status-mark status-partial"><span class="status-dot"></span>Configuration loaded</span>
              <strong style="font-size:15px">${esc(run.taskTitle)}</strong>
            </div>
            <div style="font-size:12px;color:var(--text-muted);font-family:var(--font-mono);margin-bottom:12px">
              Configuration loaded from run ${run.id}. Run comparison to execute.
            </div>
            <div style="font-size:14px;line-height:1.6;color:var(--text-secondary);margin-bottom:16px">${esc(run.taskPromptFull || run.taskPrompt || "—")}</div>
            <div class="detail-section-title" style="margin-bottom:8px">Model slots (${candidates.length})</div>
            <div style="display:flex;flex-wrap:wrap;gap:8px">${candidates.map(c => `<span class="tag">${esc(c.model)}</span>`).join("")}</div>
            ${run.systemPrompt ? '<div style="font-size:12px;color:var(--text-muted);margin-top:12px">System: ' + esc(run.systemPrompt) + "</div>" : ""}
          </div>
          <div style="display:flex;gap:8px">
            <button class="btn btn-primary" onclick="runCompare()">Run comparison</button>
            <button class="btn" onclick="resetCompare()">New Compare</button>
          </div>
        </div>
      `;
    }
    return;
  }

  ws.innerHTML = `
    <div class="workspace-full">
      <div class="compare-toolbar" style="margin:-24px -24px 24px;border-radius:0">
        <div class="mode-toggle"><button class="active">Rank</button><button>Fuse</button></div>
      </div>
      <div class="empty-state">
        <div class="empty-state-title">Configure your comparison</div>
        <p style="margin-bottom:16px">Set up a task, choose models, and run a blind comparison.</p>
        <button class="btn btn-primary" onclick="runCompare()">Run comparison</button>
      </div>
      <div style="margin-top:32px">
        <div class="detail-section-title" style="margin-bottom:12px">Recent runs</div>
        ${RUNS.slice(0, 3).map(r => `
          <div class="card card-hover" style="margin-bottom:8px;cursor:pointer" onclick="selectRunFromCompare('${r.id}')">
            <div style="display:flex;align-items:center;gap:8px;margin-bottom:4px">
              <span class="source-label source-${r.source}">${getSourceLabel(r.source)}</span>
              <span style="font-weight:500">${r.taskTitle}</span>
            </div>
            <div style="font-size:12px;color:var(--text-muted);font-family:var(--font-mono)">${timeAgo(r.createdAt)} · ${getStatusLabel(r.status)}</div>
          </div>
        `).join("")}
      </div>
    </div>
  `;
}

function resetCompare() {
  compareState = { completed: false, runId: null, preloaded: false };
  renderCompareView();
}

function runCompare() {
  compareState = { completed: true, runId: compareState.runId || "run-20260809-001" };
  renderCompareView();
}

function viewRecord(id) { navigate("runs", id); }
function selectRunFromCompare(id) { navigate("runs", id); }

function openInCompare(id) {
  const r = getRunById(id);
  if (!r || r.source === "legacy") return; // legacy runs have no config to load
  compareState = { completed: false, runId: id, preloaded: true };
  navigate("compare", null, true);
}

function copyLink(id, btn) {
  const url = window.location.origin + window.location.pathname + "#/runs/" + id;
  const done = () => {
    if (btn) {
      const orig = btn.textContent;
      btn.textContent = "Copied!";
      btn.disabled = true;
      setTimeout(() => { btn.textContent = orig; btn.disabled = false; }, 1500);
    }
  };
  const fallback = () => {
    const ta = document.createElement("textarea");
    ta.value = url;
    ta.style.position = "fixed";
    ta.style.opacity = "0";
    document.body.appendChild(ta);
    ta.select();
    try { document.execCommand("copy"); } catch (e) {}
    document.body.removeChild(ta);
    done();
  };
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(url).then(done).catch(fallback);
  } else {
    fallback();
  }
}

// ===== Evaluations View =====
function renderEvaluationsView() {
  const ws = document.getElementById("workspace");
  const exp = EXPERIMENTS[0];
  ws.innerHTML = `
    <div class="workspace-full">
      <div class="detail-section-title" style="margin-bottom:16px">Experiments</div>
      <div class="card" style="margin-bottom:24px">
        <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:12px">
          <div>
            <strong style="font-size:16px">${exp.suiteName}</strong>
            <span class="tag" style="margin-left:8px">${exp.status}</span>
          </div>
          <span class="muted" style="font-size:12px;font-family:var(--font-mono)">${formatDate(exp.createdAt)}</span>
        </div>
        <div style="font-size:12px;color:var(--text-muted);margin-bottom:16px">${exp.models.length} models · ${exp.tasks.length} tasks</div>
        <table class="eval-matrix">
          <thead>
            <tr>
              <th>Task</th>
              ${exp.models.map(m => "<th>" + m + "</th>").join("")}
              <th>Best</th>
            </tr>
          </thead>
          <tbody>
            ${exp.tasks.map(t => `
              <tr>
                <td><a onclick="viewRunFromEval('${t.runId}')">${t.name}</a></td>
                ${exp.models.map(m => {
                  const run = getRunById(t.runId);
                  const cand = run?.candidates.find(c => c.model === m);
                  if (!cand || cand.score == null) return '<td class="matrix-cell-na">—</td>';
                  const cls = cand.score >= 8.5 ? "high" : cand.score >= 7.5 ? "mid" : "low";
                  return '<td><span class="matrix-score ' + cls + '">' + cand.score.toFixed(1) + "</span></td>";
                }).join("")}
                <td><span class="matrix-score high">${t.score.toFixed(1)}</span> · ${t.bestModel}</td>
              </tr>
            `).join("")}
          </tbody>
        </table>
      </div>
      <div class="detail-section-title" style="margin-bottom:12px">Task Evidence</div>
      ${exp.tasks.map(t => `
        <div class="card card-hover" style="margin-bottom:8px;cursor:pointer" onclick="viewRunFromEval('${t.runId}')">
          <div style="display:flex;align-items:center;justify-content:space-between">
            <div>
              <strong>${t.name}</strong>
              ${t.retryOf ? '<span class="tag" style="margin-left:8px">retry</span>' : ""}
            </div>
            <div style="display:flex;align-items:center;gap:8px">
              <span class="status-mark status-${t.status}"><span class="status-dot"></span>${getStatusLabel(t.status)}</span>
              <span class="muted" style="font-size:12px">View run →</span>
            </div>
          </div>
        </div>
      `).join("")}
    </div>
  `;
}

function viewRunFromEval(id) { navigate("runs", id); }

// ===== Render workspace =====
function renderWorkspace() {
  if (currentView === "runs") renderRunsView();
  else if (currentView === "compare") renderCompareView();
  else if (currentView === "evaluations") renderEvaluationsView();
}

// ===== Init =====
parseHash();
renderNav();
renderWorkspace();
updateHash();
if (document.getElementById('nav').children.length === 0) {
  setTimeout(() => { parseHash(); renderNav(); renderWorkspace(); updateHash(); }, 0);
}
</script>
</body>
</html>
