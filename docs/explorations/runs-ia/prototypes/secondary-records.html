<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RSemble AI — Candidate B · Secondary Records</title>
<link rel="stylesheet" href="shared.css">
<style>
/* ===== Candidate B additions ===== */

/* Records button in the header action zone */
.records-btn { position: relative; height: 36px; border-radius: 9999px; border: 1px solid var(--edge); }

/* Slide-over drawer */
.drawer-backdrop {
  position: fixed; inset: 0;
  background: rgba(0, 0, 0, 0.55);
  opacity: 0; pointer-events: none;
  transition: opacity 200ms;
  z-index: 40;
}
.drawer-backdrop.open { opacity: 1; pointer-events: auto; }

.drawer {
  position: fixed; top: 0; right: 0; bottom: 0;
  width: 430px; max-width: 92vw;
  background: var(--shell);
  border-left: 1px solid var(--edge);
  box-shadow: var(--shadow-popover);
  transform: translateX(100%);
  transition: transform 240ms ease;
  z-index: 50;
  display: flex; flex-direction: column;
}
.drawer.open { transform: translateX(0); }

.drawer-header {
  display: flex; align-items: center; justify-content: space-between;
  padding: var(--space-4);
  border-bottom: 1px solid var(--edge);
  background: var(--panel);
  flex-shrink: 0;
}
.drawer-footer {
  padding: var(--space-3) var(--space-4);
  border-top: 1px solid var(--edge);
  font-size: 11px; color: var(--text-muted);
  flex-shrink: 0;
}
kbd {
  font-family: var(--font-mono);
  background: var(--raised);
  border: 1px solid var(--edge-bright);
  border-bottom-width: 2px;
  border-radius: 3px;
  padding: 0 4px;
  font-size: 10px;
  color: var(--text-secondary);
}

/* Needs-attention highlight in list rows */
.needs-attention { background: rgba(255,179,0,0.045); }
.needs-attention:hover { background: rgba(255,179,0,0.09); }
.run-row.selected.needs-attention { border-left-color: var(--warning); }
.attention-chip {
  display: inline-flex; align-items: center;
  font-size: 10px; font-family: var(--font-mono); font-weight: 600;
  color: var(--warning);
  border: 1px solid rgba(255,179,0,0.4);
  background: rgba(255,179,0,0.08);
  padding: 1px 6px; border-radius: 9999px;
  white-space: nowrap;
}
</style>
</head>
<body>
<div class="app-shell" id="app">
  <header class="app-header">
    <div class="header-left">
      <svg class="logo-mark" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2L2 7l10 5 10-5-10-5z"/><path d="M2 17l10 5 10-5"/><path d="M2 12l10 5 10-5"/></svg>
      <span style="font-size:16px;font-weight:600;letter-spacing:-0.01em">RSemble AI</span>
    </div>
    <div class="header-center">
      <nav class="nav-primary" id="nav"></nav>
    </div>
    <div class="header-right">
      <button class="btn btn-sm records-btn" onclick="toggleDrawer()" title="Browse all runs">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="width:14px;height:14px"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/></svg>
        Records
      </button>
      <div class="conn-pill"><span class="conn-dot connected"></span><span>Connected</span></div>
    </div>
  </header>

  <div class="workspace" id="workspace"></div>

  <!-- Records slide-over drawer -->
  <div class="drawer-backdrop" id="drawerBackdrop" onclick="closeDrawer()"></div>
  <aside class="drawer" id="drawer" aria-label="Records">
    <div class="drawer-header">
      <div style="display:flex;align-items:center;gap:8px">
        <strong style="font-size:14px">Records</strong>
        <span class="group-count" id="drawerCount">0 runs</span>
        <span class="attention-chip" id="drawerAttn" style="display:none">0 need attention</span>
      </div>
      <button class="btn btn-ghost btn-sm" onclick="closeDrawer()" aria-label="Close drawer">✕</button>
    </div>
    <div class="filters-bar">
      <input class="filter-input" style="min-width:100px;flex:1 1 100px" placeholder="Search task, model, or id…" oninput="filterRuns(this.value)">
      <select class="filter-select" style="flex-shrink:0;width:124px" onchange="filterStatus(this.value)">
        <option value="">All statuses</option>
        <option value="completed">Completed</option>
        <option value="partial">Partial</option>
        <option value="failed">Failed</option>
        <option value="interrupted">Interrupted</option>
      </select>
      <select class="filter-select" style="flex-shrink:0;width:112px" onchange="filterSource(this.value)">
        <option value="">All sources</option>
        <option value="adhoc">Ad hoc</option>
        <option value="experiment">Experiment</option>
        <option value="legacy">Legacy</option>
      </select>
    </div>
    <div class="run-list" id="drawerList"></div>
    <div class="drawer-footer">
      Press <kbd>Cmd</kbd>+<kbd>K</kbd> or use the command palette to access records
    </div>
  </aside>
</div>

<script src="shared.js"></script>
<script>
const { RUNS, EXPERIMENTS, getStatusLabel, getSourceLabel, formatDate, timeAgo, getRunById, isSuperseded } = window.RSEMBLE_DATA;

const NAV_ITEMS = [
  { to: "compare", label: "Compare", icon: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3v18M3 9l4-4 4 4M21 15l-4 4-4-4"/></svg>' },
  { to: "evaluations", label: "Evaluations", icon: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 3v18M15 3v18M3 9h18M3 15h18"/></svg>' },
];

const ATTENTION_STATUSES = ["failed", "partial", "interrupted"];

let currentView = "compare"; // compare | evaluations | runDetail
let lastView = "compare";
let selectedRunId = null;
let compareState = { completed: false, runId: null, preloaded: false };
let drawerOpen = false;
let activeFilters = { search: "", status: "", source: "" };

function isAttention(status) { return ATTENTION_STATUSES.includes(status); }
// CC-6: superseded runs (interrupted originals with a completed retry child) do not count as attention.
function attentionCount(runs) { return runs.filter(r => isAttention(r.status) && !isSuperseded(r)).length; }

function esc(s) {
  return String(s == null ? "" : s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
}

// ===== URL state (#/compare, #/evaluations, #/runs/<id>) =====
function parseHash() {
  const raw = location.hash || "#/compare";
  const path = raw.slice(1).split("?")[0];
  const parts = path.split("/").filter(Boolean);
  if (parts[0] === "runs" && parts[1] && getRunById(parts[1])) {
    currentView = "runDetail";
    selectedRunId = parts[1];
    if (!["compare", "evaluations"].includes(lastView)) lastView = "compare";
  } else if (["compare", "evaluations"].includes(parts[0])) {
    currentView = parts[0];
  } else {
    currentView = "compare";
  }
}

function updateHash() {
  const hash = currentView === "runDetail" && selectedRunId ? "#/runs/" + selectedRunId : "#/" + currentView;
  if (location.hash !== hash) location.hash = hash;
}

window.addEventListener("hashchange", () => { parseHash(); renderNav(); renderWorkspace(); });

// ===== Navigation =====
function renderNav() {
  const nav = document.getElementById("nav");
  nav.innerHTML = NAV_ITEMS.map(item => `
    <button class="nav-item ${currentView === item.to ? "active" : ""}" onclick="navigate('${item.to}')">
      ${item.icon}
      ${item.label}
    </button>
  `).join("");
}

function navigate(view) {
  // A-1 parity: a nav click to Compare always starts fresh — never reuse a stale result.
  if (view === "compare") compareState = { completed: false, runId: null, preloaded: false };
  if (view === currentView) return;
  lastView = currentView;
  currentView = view;
  renderNav();
  renderWorkspace();
  updateHash();
}

// ===== Records drawer (secondary, non-destinational) =====
function openDrawer() {
  drawerOpen = true;
  renderDrawerList();
  document.getElementById("drawer").classList.add("open");
  document.getElementById("drawerBackdrop").classList.add("open");
  document.getElementById("drawerCount").textContent = RUNS.length + " runs";
  const attn = attentionCount(RUNS);
  const attnEl = document.getElementById("drawerAttn");
  attnEl.textContent = attn + " need attention";
  attnEl.style.display = attn ? "inline-flex" : "none";
}

function closeDrawer() {
  drawerOpen = false;
  document.getElementById("drawer")?.classList.remove("open");
  document.getElementById("drawerBackdrop")?.classList.remove("open");
}

function toggleDrawer() { drawerOpen ? closeDrawer() : openDrawer(); }

document.addEventListener("keydown", (e) => {
  if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === "k") { e.preventDefault(); toggleDrawer(); }
  if (e.key === "Escape" && drawerOpen) closeDrawer();
});

function filterRuns(val) { activeFilters.search = val.toLowerCase(); renderDrawerList(); }
function filterStatus(val) { activeFilters.status = val; renderDrawerList(); }
function filterSource(val) { activeFilters.source = val; renderDrawerList(); }

function getFilteredRuns() {
  return RUNS.filter(r => {
    if (activeFilters.status && r.status !== activeFilters.status) return false;
    if (activeFilters.source && r.source !== activeFilters.source) return false;
    if (activeFilters.search) {
      const text = (r.taskTitle + " " + (r.taskPrompt || "") + " " + r.id + " " + (r.candidates || []).map(c => c.model).join(" ")).toLowerCase();
      if (!text.includes(activeFilters.search)) return false;
    }
    return true;
  });
}

function renderDrawerList() {
  const list = document.getElementById("drawerList");
  if (!list) return;
  const runs = getFilteredRuns();
  if (!runs.length) {
    list.innerHTML = `<div class="empty-state"><div class="empty-state-title">No records match</div><p>Try clearing the filters.</p></div>`;
    return;
  }
  list.innerHTML = runs.map(r => {
    const attn = isAttention(r.status);
    return `
      <div class="run-row ${attn ? "needs-attention" : ""}" onclick="openRunDetail('${r.id}')">
        <div class="run-row-icon source-${r.source}">${r.source === "adhoc" ? "AH" : r.source === "experiment" ? "EX" : "LG"}</div>
        <div style="flex:1;min-width:0">
          <div style="display:flex;align-items:center;gap:6px;margin-bottom:2px;flex-wrap:wrap">
            <span class="source-label source-${r.source}">${getSourceLabel(r.source)}</span>
            <span class="status-mark status-${r.status}"><span class="status-dot"></span>${getStatusLabel(r.status)}</span>
            ${attn ? '<span class="attention-chip">Needs attention</span>' : ""}
          </div>
          <div style="font-size:13px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${r.taskTitle}</div>
          <div style="font-size:11px;color:var(--text-muted);font-family:var(--font-mono);margin-top:2px">
            ${timeAgo(r.createdAt)} · ${(r.candidates || []).length} models · ${r.mode}
            ${r.cost ? " · $" + r.cost.totalUsd.toFixed(4) : ""}
          </div>
        </div>
        <span class="muted" style="font-size:11px">→</span>
      </div>`;
  }).join("");
}

// ===== Run Detail — full page (drawer hands off here) =====
function openRunDetail(id) {
  const r = getRunById(id);
  if (!r) return;
  if (currentView !== "runDetail") lastView = currentView;
  currentView = "runDetail";
  selectedRunId = id;
  closeDrawer();
  renderNav();
  renderWorkspace();
  updateHash();
}

function backFromDetail() {
  currentView = ["compare", "evaluations"].includes(lastView) ? lastView : "compare";
  selectedRunId = null;
  renderNav();
  renderWorkspace();
  updateHash();
}

function renderRunDetailPage(id) {
  const r = getRunById(id);
  if (!r) { backFromDetail(); return; }
  const ws = document.getElementById("workspace");
  const backLabel = lastView === "evaluations" ? "Evaluations" : "Compare";
  const attn = isAttention(r.status);
  const provenanceHtml = r.source === "experiment" ? `
    <div class="provenance-trail" style="margin-top:8px">
      ← <a class="provenance-link" onclick="navigate('evaluations')">Experiment: ${r.suiteName || r.experimentId}</a>
      · Task: ${r.taskName || r.taskId}
      ${r.trial > 1 ? " · Trial " + r.trial : ""}
    </div>
  ` : (r.source === "legacy" ? `
    <div class="provenance-trail" style="margin-top:8px">← Imported record (legacy import)</div>
  ` : "");
  const reusedFromHtml = r.reusedFrom ? `
    <div class="provenance-trail" style="margin-top:4px">
      ↺ Retry of <a class="provenance-link" onclick="openRunDetail('${r.reusedFrom.sourceRunId}')">${r.reusedFrom.sourceRunId}</a>
    </div>
  ` : "";
  const legacyNote = r.source === "legacy" ? `
    <div class="card" style="margin-bottom:16px;border-color:var(--warning);background:rgba(255,179,0,0.05)">
      <strong style="color:var(--warning)">Summary only</strong> — this is a legacy imported record with no detailed evidence.
    </div>
  ` : "";

  ws.innerHTML = `
    <div class="workspace-full">
      <div style="display:flex;align-items:center;gap:12px;margin-bottom:16px">
        <button class="btn btn-sm" onclick="backFromDetail()">← Back to ${backLabel}</button>
        <span class="muted" style="font-size:12px;font-family:var(--font-mono)">Run detail</span>
        <span style="flex:1"></span>
        ${r.source === "legacy"
          ? '<button class="btn btn-sm" disabled title="Legacy run has no config to load">Open in Compare</button>'
          : `<button class="btn btn-sm" onclick="openInCompare('${r.id}')">Open in Compare</button>`}
        <button class="btn btn-sm" onclick="copyLink('${r.id}', this)">Copy link — this device</button>
      </div>

      <div class="card" style="margin-bottom:16px">
        <div style="display:flex;align-items:center;gap:12px;margin-bottom:8px;flex-wrap:wrap">
          <span class="source-label source-${r.source}">${getSourceLabel(r.source)}</span>
          <span class="status-mark status-${r.status}"><span class="status-dot"></span>${getStatusLabel(r.status)}</span>
          <span class="tag">${r.mode}</span>
          ${attn ? '<span class="attention-chip">Needs attention</span>' : ""}
        </div>
        <div class="detail-title">${r.taskTitle}</div>
        <div class="detail-meta">
          <span>${formatDate(r.createdAt)}</span>
          <span>· ${r.duration || "—"}</span>
          <span>· ${(r.candidates || []).length} candidates</span>
          ${r.cost ? '<span>· $' + r.cost.totalUsd.toFixed(4) + '</span>' : ""}
        </div>
        ${provenanceHtml}
        ${reusedFromHtml}
      </div>

      ${legacyNote}
      ${r.source !== "legacy" ? renderDetailSections(r) : ""}
    </div>
  `;
}

function renderDetailSections(r) {
  const candidatesHtml = (r.candidates || []).map((c, i) => `
    <div class="card" style="margin-bottom:12px">
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:8px">
        <div style="display:flex;align-items:center;gap:8px">
          <span class="run-row-icon" style="background:var(--raised);color:var(--text-secondary)">${i+1}</span>
          <strong>${c.model}</strong>
          ${c.rank ? '<span class="tag">Rank #' + c.rank + '</span>' : ""}
        </div>
        <span class="status-mark status-${c.status === "done" ? "completed" : c.status === "error" ? "failed" : c.status === "pending" ? "interrupted" : "running"}">
          <span class="status-dot"></span>${c.status}
          ${c.score ? " · " + c.score : ""}
        </span>
      </div>
      ${c.error ? '<div style="color:var(--error);font-size:12px;font-family:var(--font-mono)">Error: ' + c.error + "</div>" : ""}
      <div style="font-size:12px;color:var(--text-muted);font-family:var(--font-mono)">${c.providerId}/${c.slug}</div>
    </div>
  `).join("");

  const judgeHtml = r.judge ? `
    <div class="card">
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:8px">
        <strong>${r.judge.model}</strong>
        ${r.judge.error
          ? '<span class="error" style="font-size:12px">' + r.judge.error + "</span>"
          : r.fusionStatus === "no_accept"
            ? '<span class="status-mark status-partial"><span class="status-dot"></span>No consensus — fusion not accepted</span>'
            : '<span class="status-mark status-completed"><span class="status-dot"></span>Accepted</span>'}
      </div>
      <div style="font-size:12px;color:var(--text-muted);font-family:var(--font-mono)">${r.judge.providerId} · ${r.judge.instruction}</div>
      ${r.judge.consensus ? '<div style="margin-top:8px;font-size:12px;color:var(--text-secondary)">' + Object.entries(r.judge.consensus).map(([k,v]) => k + ": " + (v*100).toFixed(0) + "%").join(" · ") + "</div>" : ""}
    </div>
  ` : "";

  return `
    <div class="detail-section" style="border:1px solid var(--edge);border-radius:var(--radius-lg);margin-bottom:16px;background:var(--card)">
      <div class="detail-section-title">Task</div>
      <div style="font-size:14px;margin-bottom:8px">${r.taskPrompt || "—"}</div>
      ${r.systemPrompt ? '<div style="font-size:12px;color:var(--text-muted)">System: ' + r.systemPrompt + "</div>" : ""}
      <div style="font-size:12px;color:var(--text-muted);font-family:var(--font-mono);margin-top:4px">Temperature: ${r.temperature}</div>
    </div>
    <div class="detail-section" style="border:1px solid var(--edge);border-radius:var(--radius-lg);margin-bottom:16px;background:var(--card)">
      <div class="detail-section-title">Candidates (${(r.candidates || []).length})</div>
      ${candidatesHtml}
    </div>
    ${r.judge ? '<div class="detail-section" style="border:1px solid var(--edge);border-radius:var(--radius-lg);margin-bottom:16px;background:var(--card)"><div class="detail-section-title">Judge Evidence</div>' + judgeHtml + "</div>" : ""}
    ${r.rankResult ? '<div class="detail-section" style="border:1px solid var(--edge);border-radius:var(--radius-lg);margin-bottom:16px;background:var(--card)"><div class="detail-section-title">Result</div><div class="card" style="border-color:var(--accent)"><strong style="color:var(--accent)">Rank Winner: ' + (r.candidates.find(c => c.id === r.rankResult)?.model || "?") + "</strong></div></div>" : ""}
    ${r.fusionResult ? '<div class="detail-section" style="border:1px solid var(--edge);border-radius:var(--radius-lg);margin-bottom:16px;background:var(--card)"><div class="detail-section-title">Fusion Result</div><div class="card"><div style="font-size:14px;line-height:1.6">' + r.fusionResult + "</div></div></div>" : ""}
    ${r.cost ? `
    <div class="detail-section" style="border:1px solid var(--edge);border-radius:var(--radius-lg);margin-bottom:16px;background:var(--card)">
      <div class="detail-section-title">Cost — this record</div>
      <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:var(--space-3)">
        <div class="cost-cell" style="background:var(--raised);border:1px solid var(--edge);border-radius:var(--radius-md);padding:var(--space-3)">
          <div style="font-size:10px;text-transform:uppercase;letter-spacing:0.05em;color:var(--text-muted);margin-bottom:4px">Tokens in</div>
          <div style="font-family:var(--font-mono);font-size:15px;font-weight:600">${r.cost.tokensIn.toLocaleString()}</div>
        </div>
        <div class="cost-cell" style="background:var(--raised);border:1px solid var(--edge);border-radius:var(--radius-md);padding:var(--space-3)">
          <div style="font-size:10px;text-transform:uppercase;letter-spacing:0.05em;color:var(--text-muted);margin-bottom:4px">Tokens out</div>
          <div style="font-family:var(--font-mono);font-size:15px;font-weight:600">${r.cost.tokensOut.toLocaleString()}</div>
        </div>
        <div class="cost-cell" style="background:var(--raised);border:1px solid var(--edge);border-radius:var(--radius-md);padding:var(--space-3)">
          <div style="font-size:10px;text-transform:uppercase;letter-spacing:0.05em;color:var(--text-muted);margin-bottom:4px">Total</div>
          <div style="font-family:var(--font-mono);font-size:15px;font-weight:600;color:var(--accent)">$${r.cost.totalUsd.toFixed(4)}</div>
        </div>
      </div>
    </div>` : ""}
  `;
}

// ===== Compare View =====
function renderCompareView() {
  const ws = document.getElementById("workspace");

  // Simulated completed run — only reachable via explicit "Run comparison".
  if (compareState.completed) {
    const run = getRunById(compareState.runId);
    const winnerModel = run
      ? (run.rankResult
          ? (run.candidates.find(c => c.id === run.rankResult)?.model || run.candidates[0]?.model)
          : run.candidates[0]?.model)
      : "DeepSeek V4 Flash";
    const resultLabel = run && run.mode === "fuse" ? "Fused" : "Rank Winner";
    const modelsLine = run ? run.candidates.map(c => c.model).join(", ") : "DeepSeek V4 Flash, GLM-5.2, Qwen 3.6 35B";
    const bodyText = run
      ? esc((run.taskPromptFull || run.taskPrompt || "")).slice(0, 240) + "…"
      : "The multi-head self-attention mechanism projects the input into Query, Key, and Value matrices, computes scaled dot-product attention, and concatenates multiple heads to capture different representation subspaces…";
    ws.innerHTML = `
      <div class="workspace-full">
        <div class="compare-toolbar" style="margin:-24px -24px 24px;border-radius:0">
          <div class="mode-toggle"><button class="${run && run.mode === "fuse" ? "" : "active"}">Rank</button><button class="${run && run.mode === "fuse" ? "active" : ""}">Fuse</button></div>
          <span class="muted" style="font-size:12px">${run ? run.candidates.length : 3} candidates · ${modelsLine}</span>
        </div>
        <div class="card" style="border-color:var(--success);margin-bottom:16px">
          <div style="display:flex;align-items:center;gap:12px;margin-bottom:12px;flex-wrap:wrap">
            <span class="status-mark status-completed"><span class="status-dot"></span>Completed</span>
            <strong>${resultLabel}: ${winnerModel}</strong>
          </div>
          <div style="font-size:12px;color:var(--text-muted);font-family:var(--font-mono);margin-bottom:8px">${run ? "Simulated from run " + run.id : ""}</div>
          <div style="font-size:14px;line-height:1.6;color:var(--text-secondary)">${bodyText}</div>
        </div>
        <div style="display:flex;gap:8px">
          <button class="btn btn-primary" onclick="viewRecord('${run?.id}')">View record →</button>
          <button class="btn" onclick="resetCompare()">New Compare</button>
        </div>
      </div>
    `;
    return;
  }

  // Configuration loaded from a run record (Open in Compare) — ready to run, no fabricated result.
  if (compareState.preloaded && compareState.runId) {
    const run = getRunById(compareState.runId);
    if (!run) {
      compareState = { completed: false, runId: null, preloaded: false };
    } else {
      const candidates = run.candidates || [];
      ws.innerHTML = `
        <div class="workspace-full">
          <div class="compare-toolbar" style="margin:-24px -24px 24px;border-radius:0">
            <div class="mode-toggle"><button class="${run.mode === "fuse" ? "" : "active"}">Rank</button><button class="${run.mode === "fuse" ? "active" : ""}">Fuse</button></div>
            <span class="muted" style="font-size:12px">${candidates.length} model slots · ${run.id}</span>
          </div>
          <div class="card" style="border-color:var(--accent);margin-bottom:16px">
            <div style="display:flex;align-items:center;gap:12px;margin-bottom:12px;flex-wrap:wrap">
              <span class="status-mark status-partial"><span class="status-dot"></span>Configuration loaded</span>
              <strong style="font-size:15px">${esc(run.taskTitle)}</strong>
            </div>
            <div style="font-size:12px;color:var(--text-muted);font-family:var(--font-mono);margin-bottom:12px">
              Configuration loaded from run ${run.id}. Run comparison to execute.
            </div>
            <div style="font-size:14px;line-height:1.6;color:var(--text-secondary);margin-bottom:16px">${esc(run.taskPromptFull || run.taskPrompt || "—")}</div>
            <div class="detail-section-title" style="margin-bottom:8px">Model slots (${candidates.length})</div>
            <div style="display:flex;flex-wrap:wrap;gap:8px">${candidates.map(c => `<span class="tag">${esc(c.model)}</span>`).join("")}</div>
            ${run.systemPrompt ? '<div style="font-size:12px;color:var(--text-muted);margin-top:12px">System: ' + esc(run.systemPrompt) + "</div>" : ""}
          </div>
          <div style="display:flex;gap:8px">
            <button class="btn btn-primary" onclick="runCompare()">Run comparison</button>
            <button class="btn" onclick="resetCompare()">New Compare</button>
          </div>
        </div>
      `;
    }
    return;
  }

  ws.innerHTML = `
    <div class="workspace-full">
      <div class="compare-toolbar" style="margin:-24px -24px 24px;border-radius:0">
        <div class="mode-toggle"><button class="active">Rank</button><button>Fuse</button></div>
      </div>
      <div class="empty-state">
        <div class="empty-state-title">Configure your comparison</div>
        <p style="margin-bottom:16px">Set up a task, choose models, and run a blind comparison.</p>
        <button class="btn btn-primary" onclick="runCompare()">Run comparison</button>
        <p style="margin-top:16px;font-size:12px">Past runs live in <a class="provenance-link" onclick="openDrawer()">Records</a> — one click away.</p>
      </div>
      <div style="margin-top:32px">
        <div class="detail-section-title" style="margin-bottom:12px">Recent runs</div>
        ${RUNS.slice(0, 3).map(r => `
          <div class="card card-hover" style="margin-bottom:8px;cursor:pointer" onclick="openRunDetail('${r.id}')">
            <div style="display:flex;align-items:center;gap:8px;margin-bottom:4px">
              <span class="source-label source-${r.source}">${getSourceLabel(r.source)}</span>
              <span style="font-weight:500">${r.taskTitle}</span>
            </div>
            <div style="font-size:12px;color:var(--text-muted);font-family:var(--font-mono)">${timeAgo(r.createdAt)} · ${getStatusLabel(r.status)}</div>
          </div>
        `).join("")}
      </div>
    </div>
  `;
}

function resetCompare() {
  compareState = { completed: false, runId: null, preloaded: false };
  renderCompareView();
}

function runCompare() {
  compareState = { completed: true, runId: compareState.runId || "run-20260809-001" };
  renderCompareView();
}

function viewRecord(id) { openRunDetail(id); }

function openInCompare(id) {
  const r = getRunById(id);
  if (!r || r.source === "legacy") return; // legacy runs have no config to load
  compareState = { completed: false, runId: id, preloaded: true };
  currentView = "compare";
  lastView = "compare";
  renderNav();
  renderWorkspace();
  updateHash();
}

function copyLink(id, btn) {
  const url = window.location.origin + window.location.pathname + "#/runs/" + id;
  const done = () => {
    if (btn) {
      const orig = btn.textContent;
      btn.textContent = "Copied!";
      btn.disabled = true;
      setTimeout(() => { btn.textContent = orig; btn.disabled = false; }, 1500);
    }
  };
  const fallback = () => {
    const ta = document.createElement("textarea");
    ta.value = url;
    ta.style.position = "fixed";
    ta.style.opacity = "0";
    document.body.appendChild(ta);
    ta.select();
    try { document.execCommand("copy"); } catch (e) {}
    document.body.removeChild(ta);
    done();
  };
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(url).then(done).catch(fallback);
  } else {
    fallback();
  }
}

// ===== Evaluations View =====
function renderEvaluationsView() {
  const ws = document.getElementById("workspace");
  const exp = EXPERIMENTS[0];
  ws.innerHTML = `
    <div class="workspace-full">
      <div class="detail-section-title" style="margin-bottom:16px">Experiments</div>
      <div class="card" style="margin-bottom:24px">
        <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:12px">
          <div>
            <strong style="font-size:16px">${exp.suiteName}</strong>
            <span class="tag" style="margin-left:8px">${exp.status}</span>
          </div>
          <span class="muted" style="font-size:12px;font-family:var(--font-mono)">${formatDate(exp.createdAt)}</span>
        </div>
        <div style="font-size:12px;color:var(--text-muted);margin-bottom:16px">${exp.models.length} models · ${exp.tasks.length} tasks</div>
        <table class="eval-matrix">
          <thead>
            <tr>
              <th>Task</th>
              ${exp.models.map(m => "<th>" + m + "</th>").join("")}
              <th>Best</th>
            </tr>
          </thead>
          <tbody>
            ${exp.tasks.map(t => `
              <tr>
                <td><a onclick="viewRunFromEval('${t.runId}')">${t.name}</a></td>
                ${exp.models.map(m => {
                  const run = getRunById(t.runId);
                  const cand = run?.candidates.find(c => c.model === m);
                  if (!cand || cand.score == null) return '<td class="matrix-cell-na">—</td>';
                  const cls = cand.score >= 8.5 ? "high" : cand.score >= 7.5 ? "mid" : "low";
                  return '<td><span class="matrix-score ' + cls + '">' + cand.score.toFixed(1) + "</span></td>";
                }).join("")}
                <td><span class="matrix-score high">${t.score.toFixed(1)}</span> · ${t.bestModel}</td>
              </tr>
            `).join("")}
          </tbody>
        </table>
      </div>
      <div class="detail-section-title" style="margin-bottom:12px">Task Evidence</div>
      ${exp.tasks.map(t => `
        <div class="card card-hover" style="margin-bottom:8px;cursor:pointer" onclick="viewRunFromEval('${t.runId}')">
          <div style="display:flex;align-items:center;justify-content:space-between">
            <div>
              <strong>${t.name}</strong>
              ${t.retryOf ? '<span class="tag" style="margin-left:8px">retry</span>' : ""}
            </div>
            <div style="display:flex;align-items:center;gap:8px">
              <span class="status-mark status-${t.status}"><span class="status-dot"></span>${getStatusLabel(t.status)}</span>
              <span class="muted" style="font-size:12px">View run →</span>
            </div>
          </div>
        </div>
      `).join("")}
    </div>
  `;
}

function viewRunFromEval(id) { openRunDetail(id); }

// ===== Render workspace =====
function renderWorkspace() {
  if (currentView === "runDetail" && selectedRunId) renderRunDetailPage(selectedRunId);
  else if (currentView === "compare") renderCompareView();
  else if (currentView === "evaluations") renderEvaluationsView();
  else renderCompareView();
}

// ===== Init =====
parseHash();
renderNav();
renderWorkspace();
updateHash();
if (document.getElementById('nav').children.length === 0) {
  setTimeout(() => { parseHash(); renderNav(); renderWorkspace(); updateHash(); }, 0);
}
</script>
</body>
</html>
